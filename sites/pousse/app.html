<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pousse — Espace prospection</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236a4fd6'/%3E%3Cpath d='M16 25V14M16 16c0-5 4-8 9-8 0 5-4 8-9 8zM16 19c0-4-3-6-7-6 0 4 3 6 7 6z' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --primary:#6a4fd6;--primary-dark:#5238b8;--primary-light:#8f74e6;--primary-soft:#f0ebff;
  --accent:#e8a33d;--ink:#0f1733;--ink-2:#24306b;--text:#4a5372;--muted:#8a92ad;
  --line:#e6e9f2;--bg-soft:#f5f7fc;--white:#fff;--danger:#e5484d;
  --shadow:0 10px 30px rgba(15,23,51,.08);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--text);background:var(--bg-soft);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
h1,h2,h3{color:var(--ink);margin:0;letter-spacing:-.02em}
.top{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000}
.top .in{max-width:1400px;margin:auto;padding:0 16px;height:64px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;color:var(--ink)}
.logo-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center}
.top .tag{font-size:.75rem;font-weight:700;color:var(--primary);background:var(--primary-soft);padding:4px 10px;border-radius:999px}
.top .sp{flex:1}
@media (max-width:520px){.top .tag{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;border-radius:999px;padding:11px 20px;font-weight:700;font-size:.95rem;transition:background .2s,transform .15s;white-space:nowrap}
.btn:disabled{opacity:.6;cursor:wait}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 8px 20px rgba(106,79,214,.3)}
.btn-primary:hover:not(:disabled){background:var(--primary-dark)}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:7px 14px;font-size:.85rem}
.wrap{max-width:1400px;margin:auto;padding:20px 16px 40px}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
form.search{display:grid;grid-template-columns:1fr 1fr auto auto;gap:12px;align-items:end;padding:16px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field span{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input,.field select{width:100%;font:inherit;color:var(--ink);padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg-soft)}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(106,79,214,.12)}
.chk{display:flex;gap:8px;align-items:center;font-size:.88rem;font-weight:600;color:var(--ink);padding-bottom:11px}
.chk input{accent-color:var(--primary);width:16px;height:16px}
@media (max-width:820px){form.search{grid-template-columns:1fr 1fr}form.search .btn{grid-column:1/-1}.chk{padding:0}}
.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 2px;font-size:.92rem}
.status b{color:var(--ink)}
.pill{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary)}
.pill.warn{background:#fdf0dc;color:#9a5b06}
.pill.ok{background:#dff8f2;color:#0f9a82}
.err{background:#fff5f5;color:#c62828;border:1px solid #ffd6d6;border-radius:14px;padding:12px 16px;margin-top:16px;display:none}
.err.show{display:block}
.grid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.list{padding:10px;max-height:calc(100vh - 230px);overflow:auto;display:flex;flex-direction:column;gap:8px}
@media (max-width:980px){.list{max-height:none}}
.list .tools{display:flex;gap:8px;align-items:center;padding:4px 4px 8px}
.list .tools select{font:inherit;font-size:.85rem;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;color:var(--ink)}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;transition:border-color .15s,background .15s}
.item:hover{border-color:var(--primary-light)}
.item.on{border-color:var(--primary);background:#faf8ff}
.item b{color:var(--ink);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{grid-column:1/-1;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:.78rem;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary);align-self:start}
.score.high{background:#fdf0dc;color:#9a5b06}
.st{font-size:.7rem;font-weight:700;color:var(--muted)}
.st.signe{color:#0f9a82}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
#map{height:320px;border-radius:20px 20px 0 0;z-index:1}
.detail{padding:22px}
.detail h2{font-size:1.5rem}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:16px 0}
.kv div{background:var(--bg-soft);border-radius:12px;padding:10px 12px;min-width:0}
.kv small{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kv span,.kv a{font-weight:600;color:var(--ink);word-break:break-word}
.kv a{color:var(--primary)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.script{background:linear-gradient(160deg,var(--ink),var(--ink-2));color:#fff;border-radius:16px;padding:16px;margin:16px 0;font-size:.93rem}
.script small{display:block;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.7rem;margin-bottom:6px}
.brief-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}
.styles{display:flex;gap:6px;flex-wrap:wrap}
.styles button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;color:var(--muted)}
.styles button.on{background:var(--primary);border-color:var(--primary);color:#fff}
pre.brief{white-space:pre-wrap;background:var(--bg-soft);border:1px solid var(--line);border-radius:14px;padding:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;line-height:1.6;color:var(--ink);max-height:520px;overflow:auto;margin:12px 0 0}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.gate{max-width:420px;margin:60px auto;padding:28px;text-align:center}
.gate p{margin:8px 0 18px}
.gate form{display:flex;gap:8px}
.gate input{flex:1;font:inherit;padding:11px 14px;border-radius:999px;border:1.5px solid var(--line)}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:2000;transition:transform .3s}
.toast.show{transform:translate(-50%,0)}
.leaflet-container{font-family:var(--font)}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <a href="index.html" class="logo"><span class="logo-mark"><svg width="18" height="18" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 27V13M16 15c0-5 4-8 9-8 0 5-4 8-9 8zM16 19c0-4-3-6-7-6 0 4 3 6 7 6z"/></svg></span>Pousse</a>
    <span class="tag">Espace prospection</span>
    <span class="sp"></span>
    <button class="btn btn-ghost btn-sm hidden" id="logout">Changer de code</button>
  </div>
</header>

<div class="card gate hidden" id="gate">
  <h2>Accès réservé</h2>
  <p>Entrez le code d'accès défini dans la variable <code>POUSSE_ACCESS_CODE</code>.</p>
  <form id="gateForm"><input id="gateInput" type="password" placeholder="Code d'accès" autocomplete="current-password" required><button class="btn btn-primary">Entrer</button></form>
</div>

<main class="wrap hidden" id="appMain">
  <form class="card search" id="searchForm">
    <label class="field"><span>Ville</span><input id="city" placeholder="Montélimar" required autocomplete="off"></label>
    <label class="field"><span>Métier</span><input id="trade" list="trades" placeholder="plombier" required autocomplete="off">
      <datalist id="trades"><option>plombier</option><option>électricien</option><option>coiffeur</option><option>barbier</option><option>restaurant</option><option>boulangerie</option><option>fleuriste</option><option>garage automobile</option><option>menuisier</option><option>maçon</option><option>peintre en bâtiment</option><option>esthéticienne</option><option>serrurier</option><option>paysagiste</option></datalist>
    </label>
    <label class="chk"><input type="checkbox" id="withManagers" checked> Chercher le gérant</label>
    <button class="btn btn-primary" id="searchBtn">Scanner</button>
  </form>
  <div class="err" id="err"></div>
  <div class="status" id="status"></div>

  <div class="grid">
    <section class="card list" id="list"><div class="empty">Lancez une recherche pour voir les entreprises sans site web.</div></section>
    <section class="card">
      <div id="map"></div>
      <div class="detail" id="detail"><div class="empty">Sélectionnez une entreprise dans la liste.</div></div>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  let toastTimer;
  const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); };

  const STATUSES = { '': 'Nouveau', appeler: 'À appeler', appele: 'Appelé', relancer: 'À relancer', signe: 'Signé', refus: 'Pas intéressé' };
  let code = store.get('pousse.code', '');
  let data = store.get('pousse.last', null);
  let pipeline = store.get('pousse.pipeline', {});
  let selected = null, style = 'nature', filter = 'all';
  const briefs = {};

  // Access gate
  const showApp = () => { $('#gate').classList.add('hidden'); $('#appMain').classList.remove('hidden'); $('#logout').classList.remove('hidden'); map?.invalidateSize(); };
  const showGate = () => { $('#gate').classList.remove('hidden'); $('#appMain').classList.add('hidden'); $('#logout').classList.add('hidden'); $('#gateInput').focus(); };
  $('#gateForm').addEventListener('submit', e => { e.preventDefault(); code = $('#gateInput').value.trim(); store.set('pousse.code', code); showApp(); });
  $('#logout').addEventListener('click', () => { code = ''; store.del('pousse.code'); showGate(); });

  async function api(path, payload) {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-pousse-code': code }, body: JSON.stringify(payload) });
    let body = {};
    try { body = await r.json(); } catch {}
    if (r.status === 401) { showGate(); throw new Error(body.error || "Code d'accès invalide."); }
    if (!r.ok) throw new Error(body.error || `Erreur ${r.status}`);
    return body;
  }
  const showErr = msg => { const e = $('#err'); e.textContent = msg; e.classList.toggle('show', !!msg); };

  // Map
  // The map is a bonus: if Leaflet can't load, the rest of the tool still works.
  const hasMap = typeof L !== 'undefined';
  const map = hasMap ? L.map('map', { scrollWheelZoom: false }).setView([46.6, 2.4], 5) : null;
  if (hasMap) L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  else document.getElementById('map').remove();
  const layer = hasMap ? L.layerGroup().addTo(map) : null;
  const markers = {};

  // Search
  $('#searchForm').addEventListener('submit', async e => {
    e.preventDefault();
    showErr('');
    const btn = $('#searchBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Scan en cours…';
    $('#status').innerHTML = '<span class="spin"></span> Recherche des entreprises et de leurs gérants (jusqu\'à 30 s)…';
    try {
      data = await api('/api/scan', { city: $('#city').value, trade: $('#trade').value, withManagers: $('#withManagers').checked });
      store.set('pousse.last', data);
      selected = null;
      render();
    } catch (err) {
      showErr(err.message); $('#status').textContent = '';
    } finally {
      btn.disabled = false; btn.textContent = 'Scanner';
    }
  });

  function render() {
    if (!data) return;
    $('#city').value = data.city; $('#trade').value = data.trade;
    const withManager = data.results.filter(r => r.manager?.name).length;
    $('#status').innerHTML = `<b>${data.withoutWebsite}</b> entreprises sans site sur <b>${data.scanned}</b> analysées · ${esc(data.trade)} à ${esc(data.city)}
      <span class="pill">${withManager} gérant${withManager > 1 ? 's' : ''} trouvé${withManager > 1 ? 's' : ''}</span>`;
    renderList();
    layer?.clearLayers();
    const pts = [];
    data.results.forEach(r => {
      if (!hasMap || r.lat == null) return;
      const m = L.circleMarker([r.lat, r.lng], { radius: 7, color: '#fff', weight: 2, fillColor: r.score >= 80 ? '#e8a33d' : '#6a4fd6', fillOpacity: 1 })
        .bindTooltip(r.name).on('click', () => select(r.id));
      m.addTo(layer); markers[r.id] = m; pts.push([r.lat, r.lng]);
    });
    if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 14 });
    if (selected) select(selected); else $('#detail').innerHTML = '<div class="empty">Sélectionnez une entreprise dans la liste.</div>';
  }

  function renderList() {
    const rows = data.results.filter(r => filter === 'all' || (pipeline[r.id] || '') === filter);
    const opts = Object.entries({ all: 'Tous', ...STATUSES }).map(([k, v]) => `<option value="${k}"${k === filter ? ' selected' : ''}>${v}</option>`).join('');
    $('#list').innerHTML = `<div class="tools"><select id="filter" aria-label="Filtrer par statut">${opts}</select><span style="flex:1"></span><button class="btn btn-ghost btn-sm" id="csv">Export CSV</button></div>`
      + (rows.length ? rows.map(r => {
        const st = pipeline[r.id] || '';
        return `<button class="item${r.id === selected ? ' on' : ''}" data-id="${esc(r.id)}">
          <b>${esc(r.name)}</b><span class="score${r.score >= 80 ? ' high' : ''}">${r.score}</span>
          <small>${r.manager?.name ? esc(r.manager.name) + ' · ' : ''}${r.rating ? '★ ' + String(r.rating).replace('.', ',') + ' (' + r.reviews + ') · ' : ''}${esc(r.phone || 'pas de téléphone')}</small>
          ${st ? `<small class="st ${st}">${STATUSES[st]}</small>` : ''}
        </button>`;
      }).join('') : '<div class="empty">Aucune entreprise pour ce filtre.</div>');
    $('#filter').addEventListener('change', e => { filter = e.target.value; renderList(); });
    $('#csv').addEventListener('click', exportCsv);
    document.querySelectorAll('.item').forEach(el => el.addEventListener('click', () => select(el.dataset.id)));
  }

  function script(r) {
    const who = r.manager?.name ? `Bonjour, je suis bien avec ${r.manager.name} ?` : 'Bonjour, je pourrais parler au responsable ?';
    const proof = r.reviews >= 10 ? `Vous avez ${r.reviews} avis Google avec une note de ${String(r.rating).replace('.', ',')}, vos clients vous apprécient` : 'Vos clients vous cherchent sur Google';
    return `${who} Je travaille avec les ${esc(data.trade)}s de ${esc(data.city)}. ${proof}, mais aujourd'hui, quand quelqu'un vous cherche en ligne, il ne trouve pas de site et part chez un concurrent. J'ai préparé une idée de site pour ${esc(r.name)} : est-ce que je peux vous la montrer en deux minutes ?`;
  }

  function select(id) {
    const r = data.results.find(x => x.id === id);
    if (!r) return;
    selected = id;
    document.querySelectorAll('.item').forEach(el => el.classList.toggle('on', el.dataset.id === id));
    if (markers[id]) { map.setView(markers[id].getLatLng(), Math.max(map.getZoom(), 14)); markers[id].openTooltip(); }
    const st = pipeline[id] || '';
    const mgr = r.manager?.name
      ? `${esc(r.manager.name)}${r.manager.role ? ` <small style="text-transform:none;letter-spacing:0">(${esc(r.manager.role)})</small>` : ''}${r.manager.exact ? '' : ' <span class="pill warn">à vérifier</span>'}`
      : 'Non trouvé';
    $('#detail').innerHTML = `
      <div class="actions" style="justify-content:space-between">
        <div><h2>${esc(r.name)}</h2><div style="color:var(--muted);font-size:.9rem">${esc(r.category)}</div></div>
        <span class="score${r.score >= 80 ? ' high' : ''}" style="font-size:.9rem">Potentiel ${r.score}</span>
      </div>
      <div class="kv">
        <div><small>Gérant</small><span>${mgr}</span></div>
        <div><small>Téléphone</small>${r.phone ? `<a href="tel:${esc(r.phone.replace(/\s/g, ''))}">${esc(r.phone)}</a>` : '<span>—</span>'}</div>
        <div><small>Note Google</small><span>${r.rating ? '★ ' + String(r.rating).replace('.', ',') + ' · ' + r.reviews + ' avis' : 'Aucun avis'}</span></div>
        <div><small>Adresse</small><span>${esc(r.address)}</span></div>
        ${r.manager?.siren ? `<div><small>Société</small><a href="https://annuaire-entreprises.data.gouv.fr/entreprise/${esc(r.manager.siren)}" target="_blank" rel="noopener">${esc(r.manager.company)}</a></div>` : ''}
        ${r.social ? `<div><small>Présence en ligne</small><a href="${esc(r.social)}" target="_blank" rel="noopener">Réseau social uniquement</a></div>` : ''}
      </div>
      <div class="actions">
        ${r.phone ? `<a class="btn btn-primary btn-sm" href="tel:${esc(r.phone.replace(/\s/g, ''))}">📞 Appeler</a>` : ''}
        ${r.mapsUrl ? `<a class="btn btn-ghost btn-sm" href="${esc(r.mapsUrl)}" target="_blank" rel="noopener">Fiche Google</a>` : ''}
        <a class="btn btn-ghost btn-sm" href="https://www.google.com/search?q=${encodeURIComponent(r.name + ' ' + data.city + ' instagram')}" target="_blank" rel="noopener">Instagram</a>
        <a class="btn btn-ghost btn-sm" href="https://www.google.com/search?q=${encodeURIComponent(r.name + ' ' + data.city + ' linkedin')}" target="_blank" rel="noopener">LinkedIn</a>
        <label class="field" style="margin-left:auto"><select id="stSel" aria-label="Statut">${Object.entries(STATUSES).map(([k, v]) => `<option value="${k}"${k === st ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
      </div>
      <div class="script"><small>Script d'appel</small>${script(r)}</div>
      <div class="brief-head">
        <h3>Brief du site</h3>
        <div class="styles" id="styles">${['nature', 'minimal', 'audacieux'].map(s => `<button data-s="${s}" class="${s === style ? 'on' : ''}">${s[0].toUpperCase() + s.slice(1)}</button>`).join('')}</div>
        <button class="btn btn-primary btn-sm" id="genBrief">${briefs[id] ? 'Régénérer' : 'Générer le brief'}</button>
      </div>
      <div id="briefOut">${briefs[id] ? briefBlock(briefs[id]) : '<p style="color:var(--muted);font-size:.9rem">Claude rédige un brief complet avec les vraies infos de l\'entreprise (horaires et avis récupérés sur Google). Comptez 20 à 60 secondes.</p>'}</div>`;
    $('#stSel').addEventListener('change', e => {
      if (e.target.value) pipeline[id] = e.target.value; else delete pipeline[id];
      store.set('pousse.pipeline', pipeline); renderList();
      if (e.target.value === 'signe') toast(`🎉 ${r.name} signé !`);
    });
    $('#styles').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      style = b.dataset.s;
      document.querySelectorAll('#styles button').forEach(x => x.classList.toggle('on', x === b));
    });
    $('#genBrief').addEventListener('click', () => generateBrief(r));
    bindCopy();
  }

  const briefBlock = text => `<pre class="brief">${esc(text)}</pre><div class="actions" style="margin-top:10px"><button class="btn btn-ghost btn-sm" id="copyBrief">Copier le brief</button></div>`;
  function bindCopy() {
    const b = $('#copyBrief'); if (!b) return;
    b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(briefs[selected]); toast('Brief copié — collez-le dans Claude'); }
      catch { toast('Copie impossible dans ce navigateur'); }
    });
  }

  async function generateBrief(r) {
    const btn = $('#genBrief');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Rédaction…';
    $('#briefOut').innerHTML = '<p style="color:var(--muted)"><span class="spin"></span> Claude prépare le brief…</p>';
    try {
      const out = await api('/api/brief', { business: r, style });
      briefs[r.id] = out.brief;
      if (selected === r.id) { $('#briefOut').innerHTML = briefBlock(out.brief); bindCopy(); }
    } catch (err) {
      if (selected === r.id) $('#briefOut').innerHTML = `<div class="err show">${esc(err.message)}</div>`;
    } finally {
      if (selected === r.id) { btn.disabled = false; btn.textContent = 'Régénérer'; }
    }
  }

  function exportCsv() {
    const head = ['Entreprise', 'Métier', 'Gérant', 'Qualité', 'Téléphone', 'Adresse', 'Note', 'Avis', 'Potentiel', 'Statut', 'SIREN', 'Fiche Google', 'Réseau social'];
    const rows = data.results.map(r => [r.name, r.category, r.manager?.name || '', r.manager?.role || '', r.phone || '', r.address, r.rating ?? '', r.reviews, r.score, STATUSES[pipeline[r.id] || ''], r.manager?.siren || '', r.mapsUrl || '', r.social || '']);
    const csv = '﻿' + [head, ...rows].map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `pousse-${data.trade}-${data.city}.csv`.replace(/\s+/g, '-').toLowerCase();
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Export CSV téléchargé');
  }

  if (code) showApp(); else showGate();
  if (data) render();
})();
</script>
</body>
</html>
